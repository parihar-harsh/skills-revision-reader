<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="General live coding interview patterns with concise inline solutions.">
  <title>Live Coding Patterns</title>
  <style>
    :root {
      color-scheme: light;
      --sidebar-width: 256px;
      --background: #f4f6f7;
      --surface: #ffffff;
      --surface-soft: #eef2f3;
      --text: #182126;
      --muted: #647178;
      --border: #d3dade;
      --border-strong: #aeb9be;
      --accent: #087a62;
      --accent-hover: #056650;
      --accent-soft: #e0f3ed;
      --accent-contrast: #ffffff;
      --focus: #156ec0;
      --shadow: 0 12px 28px rgb(20 35 42 / 10%);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --background: #121719;
      --surface: #1a2023;
      --surface-soft: #222a2e;
      --text: #edf2f3;
      --muted: #a9b6bb;
      --border: #354146;
      --border-strong: #56666d;
      --accent: #65d1b6;
      --accent-hover: #82dfc8;
      --accent-soft: #173a32;
      --accent-contrast: #10231e;
      --focus: #70b8f5;
      --shadow: 0 12px 28px rgb(0 0 0 / 28%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 300px;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; letter-spacing: 0; }
    button, select { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      display: flex;
      width: var(--sidebar-width);
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    .brand {
      display: flex;
      min-height: 74px;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
    }
    .brand h1 { margin: 0; font-size: 16px; line-height: 1.25; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }

    .product-switcher {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
      margin: 10px 12px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-soft);
    }
    .product-link {
      display: inline-flex;
      min-width: 0;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      padding: 5px 4px;
      border-radius: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
    }
    .product-link:hover { background: var(--surface); color: var(--text); }
    .product-link.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgb(20 35 42 / 10%); }

    .category-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
    .nav-label { padding: 5px 8px 7px; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .category-button {
      display: grid;
      width: 100%;
      min-height: 42px;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }
    .category-button:hover { background: var(--surface-soft); color: var(--text); }
    .category-button[aria-pressed="true"] { border-left-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .category-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }
    .category-count { font-size: 10px; font-variant-numeric: tabular-nums; }

    .workspace { min-height: 100vh; margin-left: var(--sidebar-width); }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      min-height: 62px;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(12px);
    }
    .menu-button { display: none; }
    .search-wrap { flex: 1 1 auto; min-width: 160px; }
    .search-input, .role-select, .control-button {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
    }
    .search-input { width: 100%; padding: 0 12px; }
    .search-input::placeholder { color: var(--muted); }
    .role-select { min-width: 220px; padding: 0 32px 0 10px; font-size: 12px; font-weight: 700; }
    .control-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .control-button:hover, .role-select:hover { border-color: var(--border-strong); }
    .mobile-pages { display: none; }

    main { width: min(980px, 100%); margin: 0 auto; padding: 28px 30px 56px; }
    .page-head { padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .page-head h2 { margin: 0; font-size: 32px; line-height: 1.15; }
    .page-head p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .results-meta { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    .category-section { scroll-margin-top: 78px; padding-top: 26px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .section-heading h3 { margin: 0; font-size: 16px; }
    .section-heading span { color: var(--muted); font-size: 11px; }
    .question-list { display: grid; gap: 8px; }
    .question-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    .question-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
    .question-number {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 5px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .question-content { min-width: 0; }
    .question-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .question-title { min-width: 0; margin: 7px 0 0; font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }
    .idea-box {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      margin-top: 10px;
      padding: 9px 10px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
    }
    .idea-label { color: var(--accent); font-size: 9px; font-weight: 850; text-transform: uppercase; white-space: nowrap; }
    .idea-text { margin: 0; color: var(--text); font-size: 11px; line-height: 1.5; }
    .solution-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .solution-meta::before { width: 16px; height: 2px; background: var(--accent); content: ""; }
    .solution-code {
      max-width: 100%;
      margin: 6px 0 0;
      overflow-x: auto;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface-soft);
      color: var(--text);
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
      white-space: pre;
    }
    .empty-state { padding: 44px 18px; border: 1px dashed var(--border-strong); border-radius: 6px; text-align: center; }
    .empty-state h3 { margin: 0 0 4px; font-size: 17px; }
    .empty-state p { margin: 0; color: var(--muted); font-size: 12px; }
    .scrim { display: none; }

    @media (max-width: 820px) {
      .sidebar { transform: translateX(-102%); box-shadow: var(--shadow); transition: transform 180ms ease; }
      body.sidebar-open .sidebar { transform: translateX(0); }
      .scrim { position: fixed; inset: 0; z-index: 25; border: 0; background: rgb(5 12 15 / 46%); }
      body.sidebar-open .scrim { display: block; }
      .workspace { margin-left: 0; }
      .menu-button { display: inline-flex; }
      .mobile-pages { display: flex; gap: 5px; }
      .mobile-pages a { min-height: 40px; padding: 0 8px; }
      .toolbar { padding: 8px 10px; }
      .role-select { min-width: 180px; }
      main { padding: 24px 18px 48px; }
    }

    @media (max-width: 640px) {
      .toolbar { flex-wrap: wrap; gap: 6px; padding: 7px 8px; }
      .menu-button { flex: 0 0 64px; padding-inline: 7px; }
      .search-wrap { min-width: 150px; }
      .role-select { width: 100%; min-width: 0; }
      .mobile-pages { order: 4; flex: 1; }
      .mobile-pages a { flex: 1; }
      .theme-button { flex: 0 0 54px; padding-inline: 7px; }
      main { padding-inline: 10px; }
      .page-head h2 { font-size: 27px; }
      .question-row { grid-template-columns: 34px minmax(0, 1fr); gap: 9px; }
      .question-number { width: 32px; height: 32px; }
      .question-heading { display: block; }
      .question-title { margin-top: 6px; }
      .idea-box { grid-template-columns: 1fr; gap: 3px; }
      .solution-code { padding: 10px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Live coding categories">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">LC</div>
      <div>
        <h1>Live Coding</h1>
        <p id="brand-count">Patterns with solutions</p>
      </div>
    </header>
    <nav class="product-switcher" aria-label="Revision workspace">
      <a class="product-link" href="index.html">Questions</a>
      <a class="product-link active" href="live-coding.html" aria-current="page">Live coding</a>
      <a class="product-link" href="roadmap.html">AI route</a>
    </nav>
    <nav id="category-nav" class="category-nav" aria-label="Question categories"></nav>
  </aside>

  <button id="scrim" class="scrim" type="button" aria-label="Close categories"></button>

  <div class="workspace">
    <header class="toolbar">
      <button id="menu-button" class="control-button menu-button" type="button" aria-controls="sidebar" aria-expanded="false">Browse</button>
      <label class="search-wrap">
        <span class="sr-only">Search live coding patterns</span>
        <input id="search" class="search-input" type="search" placeholder="Search live coding patterns" autocomplete="off">
      </label>
      <label>
        <span class="sr-only">Filter by position</span>
        <select id="role-filter" class="role-select" aria-label="Filter by position"></select>
      </label>
      <nav class="mobile-pages" aria-label="Other revision pages">
        <a class="control-button" href="index.html">Theory</a>
        <a class="control-button" href="roadmap.html">AI route</a>
      </nav>
      <button id="theme-button" class="control-button theme-button" type="button">Theme</button>
    </header>

    <main>
      <header class="page-head">
        <p class="eyebrow">Interview practice</p>
        <h2>General live coding questions</h2>
        <p>Broad patterns with concise, interview-ready code and command references.</p>
        <span id="results-meta" class="results-meta" aria-live="polite"></span>
      </header>
      <div id="question-sections"></div>
    </main>
  </div>

  <script src="live-coding-data.js?v=instant-revision"></script>
  <script>
    (function () {
      "use strict";

      const questions = Array.isArray(window.liveCodingQuestions) ? window.liveCodingQuestions : [];
      const roleLabels = {
        "sde-1": "SDE I / Software Engineer",
        "frontend-react": "Frontend / React Developer",
        "backend-node": "Backend / Node.js Developer",
        "full-stack-js": "Full-Stack JavaScript Developer",
        "mern-stack": "MERN Stack Developer",
        "genai-app": "AI / GenAI Engineer",
        "devops-engineer": "DevOps Engineer"
      };
      const state = { search: "", role: "", category: "" };
      const elements = {
        body: document.body,
        sidebar: document.getElementById("sidebar"),
        scrim: document.getElementById("scrim"),
        menu: document.getElementById("menu-button"),
        search: document.getElementById("search"),
        role: document.getElementById("role-filter"),
        theme: document.getElementById("theme-button"),
        nav: document.getElementById("category-nav"),
        sections: document.getElementById("question-sections"),
        meta: document.getElementById("results-meta"),
        count: document.getElementById("brand-count")
      };

      const escapeHtml = (value) => String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const categories = [...new Set(questions.map((question) => question.category))];
      const roleIds = Object.keys(roleLabels).filter((id) => questions.some((question) => question.roles.includes(id)));

      elements.role.innerHTML = '<option value="">All positions</option>' + roleIds
        .map((id) => `<option value="${id}">${escapeHtml(roleLabels[id])}</option>`)
        .join("");
      elements.count.textContent = `${questions.length} patterns with solutions`;

      const closeSidebar = () => {
        elements.body.classList.remove("sidebar-open");
        elements.menu.setAttribute("aria-expanded", "false");
      };

      const renderNav = () => {
        const items = [
          { name: "", label: "All categories", count: questions.length },
          ...categories.map((name) => ({ name, label: name, count: questions.filter((question) => question.category === name).length }))
        ];
        elements.nav.innerHTML = '<div class="nav-label">Categories</div>' + items.map((item) => `
          <button class="category-button" type="button" data-category="${escapeHtml(item.name)}" aria-pressed="${state.category === item.name}">
            <span class="category-name">${escapeHtml(item.label)}</span>
            <span class="category-count">${item.count}</span>
          </button>
        `).join("");
      };

      const render = () => {
        const query = state.search.trim().toLowerCase();
        const filtered = questions.filter((question) => {
          if (state.role && !question.roles.includes(state.role)) return false;
          if (state.category && question.category !== state.category) return false;
          return !query || `${question.title} ${question.category} ${question.language} ${question.idea} ${question.solution}`.toLowerCase().includes(query);
        });
        const visibleCategories = categories.filter((category) => filtered.some((question) => question.category === category));
        let number = 0;
        elements.sections.innerHTML = visibleCategories.length ? visibleCategories.map((category) => {
          const items = filtered.filter((question) => question.category === category);
          return `
            <section class="category-section" id="category-${escapeHtml(category.toLowerCase().replaceAll(/[^a-z0-9]+/g, "-"))}">
              <div class="section-heading"><h3>${escapeHtml(category)}</h3><span>${items.length} patterns</span></div>
              <div class="question-list">
                ${items.map((question) => {
                  number += 1;
                  return `
                    <article class="question-row">
                      <span class="question-number">${String(number).padStart(2, "0")}</span>
                      <div class="question-content">
                        <div class="question-heading">
                          <h4 class="question-title">${escapeHtml(question.title)}</h4>
                        </div>
                        <div class="idea-box"><span class="idea-label">Core idea</span><p class="idea-text">${escapeHtml(question.idea)}</p></div>
                        <div class="solution-meta"><span>Key example</span><span>${escapeHtml(question.language)}</span></div>
                        <pre class="solution-code"><code>${escapeHtml(question.solution)}</code></pre>
                      </div>
                    </article>
                  `;
                }).join("")}
              </div>
            </section>
          `;
        }).join("") : `
          <div class="empty-state">
            <h3>No patterns found</h3>
            <p>Clear the search or choose a different position or category.</p>
          </div>
        `;
        elements.meta.textContent = `${filtered.length} of ${questions.length} patterns shown`;
        renderNav();
      };

      elements.search.addEventListener("input", () => { state.search = elements.search.value; render(); });
      elements.role.addEventListener("change", () => { state.role = elements.role.value; render(); });
      elements.nav.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.category = button.dataset.category;
        render();
        closeSidebar();
      });

      const applyTheme = (theme) => {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem("skills-reader-theme", theme);
      };
      const savedTheme = localStorage.getItem("skills-reader-theme");
      applyTheme(savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      elements.theme.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

      elements.menu.addEventListener("click", () => {
        const open = !elements.body.classList.contains("sidebar-open");
        elements.body.classList.toggle("sidebar-open", open);
        elements.menu.setAttribute("aria-expanded", String(open));
      });
      elements.scrim.addEventListener("click", closeSidebar);
      window.addEventListener("keydown", (event) => { if (event.key === "Escape") closeSidebar(); });
      window.addEventListener("resize", () => { if (window.innerWidth > 820) closeSidebar(); });

      render();
    })();
  </script>
</body>
</html>
